<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>BYTE BACK | 오프라인</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101a28; color: #ecf4ff; }
    main { width: min(560px, calc(100% - 44px)); padding: 28px; border: 1px solid #51667c; border-radius: 16px; background: #1a2a3d; }
    h1 { margin-top: 0; }
    p { color: #bfd0e5; line-height: 1.7; }
    button { padding: 12px 16px; border: 0; border-radius: 9px; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>현재 오프라인입니다.</h1>
    <p>이 화면은 연결 안내만 저장합니다. 로그인 정보, 기기 승인 정보, 메모 내용과 API 응답은 오프라인 캐시에 저장하지 않습니다.</p>
    <p>네트워크가 돌아오면 다시 접속해 로그인과 서버의 기기 승인 확인을 거쳐 자료실을 열어 주세요. 앱을 설치했다는 사실만으로 기기 승인이 되지는 않습니다.</p>
    <button type="button" onclick="location.reload()">다시 연결</button>
  </main>
</body>
</html>
